[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dfs-optimizer"
version = "1.0.0"
description = "Quantitative Monte Carlo Simulation & Optimization Engine for NFL DFS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydfs-lineup-optimizer>=3.6.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pulp>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
